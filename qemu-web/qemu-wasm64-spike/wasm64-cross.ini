# Meson cross file for building dependencies (not QEMU itself) as wasm64 + pthreads.
[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
strip = 'emstrip'
pkg-config = 'pkg-config'

[built-in options]
c_args = ['-sMEMORY64=1', '-pthread', '-O2']
cpp_args = ['-sMEMORY64=1', '-pthread', '-O2']
c_link_args = ['-sMEMORY64=1', '-pthread']
cpp_link_args = ['-sMEMORY64=1', '-pthread']

[host_machine]
system = 'emscripten'
cpu_family = 'wasm64'
cpu = 'wasm64'
endian = 'little'

[properties]
needs_exe_wrapper = true
