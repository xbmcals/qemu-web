name: wasm64 spike

on:
  workflow_dispatch:
    inputs:
      emsdk_version:
        description: "Emscripten version (exact version once one works)"
        default: "latest"

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # The rc1 entry fails at fetch until the tag exists; that is reported, not hidden.
        qemu_tag: ["v11.1.3", "v11.2.0-rc1"]
    env:
      QEMU_TAG: ${{ matrix.qemu_tag }}
      EMSDK_VERSION: ${{ inputs.emsdk_version || 'latest' }}
    defaults:
      run:
        working-directory: qemu-wasm64-spike
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl xz-utils pkg-config flex bison libglib2.0-dev
          pip install meson ninja packaging tomli

      - name: Run spike
        run: bash run-all.sh

      - name: Make sure a report exists
        if: always()
        run: bash 05-report.sh || true

      - name: Show report in job summary
        if: always()
        run: |
          [ -f REPORT.md ] && cat REPORT.md >> "$GITHUB_STEP_SUMMARY" || echo "No report produced" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-${{ matrix.qemu_tag }}
          path: |
            qemu-wasm64-spike/REPORT.md
            qemu-wasm64-spike/upstream/
            qemu-wasm64-spike/work/logs/
          if-no-files-found: warn
          retention-days: 30
