name: wasm spike

on:
  workflow_dispatch:
    inputs:
      emsdk_version:
        description: "Emscripten version (exact version once one works)"
        default: "latest"
  schedule:
    - cron: "0 6 * * 1"   # weekly: catches new upstream tags and Emscripten changes

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { qemu_tag: "v10.0.4", wasm_bits: "32" }   # main path, up to 4 GiB
          - { qemu_tag: "v11.1.3", wasm_bits: "64" }   # comparison; libffi blocker expected
    env:
      QEMU_TAG: ${{ matrix.qemu_tag }}
      WASM_BITS: ${{ matrix.wasm_bits }}
      EMSDK_VERSION: ${{ inputs.emsdk_version || 'latest' }}
    defaults:
      run:
        working-directory: qemu-web/qemu-wasm64-spike
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl xz-utils pkg-config flex bison libglib2.0-dev
          pip install meson ninja packaging tomli

      - name: Run spike
        run: bash run-all.sh

      - name: Make sure a report exists
        if: always()
        run: bash 05-report.sh || true

      - name: Show report in job summary
        if: always()
        run: |
          [ -f REPORT.md ] && cat REPORT.md >> "$GITHUB_STEP_SUMMARY" || echo "No report produced" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-${{ matrix.qemu_tag }}-wasm${{ matrix.wasm_bits }}
          path: |
            qemu-wasm64-spike/REPORT.md
            qemu-wasm64-spike/upstream/
            qemu-wasm64-spike/work/logs/
          if-no-files-found: warn
          retention-days: 30
